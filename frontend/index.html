<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SwipeGen PDF Editor</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css?v=1.2">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.worker.min.js"></script>
</head>
<body>
    <div class="container">
        <header class="header">
            <h1>📄 SwipeGen PDF Editor</h1>
            <p>Edit PDFs while preserving original layout</p>
        </header>

        <div class="upload-section" id="uploadSection">
            <div class="upload-card">
                <div class="upload-area" id="uploadArea">
                    <div class="upload-icon">📁</div>
                    <h3>Upload Your PDF</h3>
                    <p>Drag & drop or click to select PDF file</p>
                    <input type="file" id="fileInput" accept=".pdf" hidden>
                    <button class="btn btn-primary" onclick="document.getElementById('fileInput').click()">
                        Choose PDF File
                    </button>
                </div>
            </div>
        </div>

        <div class="editor-section" id="editorSection" style="display: none;">
            <div class="editor-header">
                <div class="file-display">
                    <h3>Editing: <span id="fileName">document.pdf</span></h3>
                    <div class="file-actions">
                        <button class="btn btn-secondary" id="downloadBtn">📥 Download</button>
                        <button class="btn btn-secondary" id="newBtn" onclick="window.location.reload()">🆕 New</button>
                    </div>
                </div>
            </div>

            <div class="editor-container">
                <div class="pdf-viewer">
                    <div class="viewer-controls">
                        <div class="page-controls">
                            <button class="btn-icon" id="prevPage">◀</button>
                            <span class="page-info" id="pageInfo">Page 1 / 1</span>
                            <button class="btn-icon" id="nextPage">▶</button>
                        </div>
                    </div>
                    <div class="pdf-container" id="pdfContainer">
                        <canvas id="pdfCanvas"></canvas>
                        <div class="text-layer" id="textLayer"></div>
                    </div>
                </div>

                <div class="editor-panel">
                    <div class="panel-section">
                        <h4>✏️ Text Editor</h4>
                        <div class="control-group">
                            <label for="selectedTextInput">Selected Text:</label>
                            <textarea id="selectedTextInput" rows="4" placeholder="Select text on PDF to edit..."></textarea>
                        </div>
                        <button class="btn btn-primary" id="applyChangesBtn">Apply Changes</button>
                    </div>

                    <div class="panel-section">
                        <h4>🎨 Text Styling</h4>
                        <div class="style-controls">
                            <div class="control-group">
                                <label>Font Size:</label>
                                <input type="range" id="fontSize" min="8" max="72" value="12">
                                <span id="fontSizeValue">12px</span>
                            </div>
                            <div class="control-group text-format-buttons">
                                <button id="fontBoldBtn" class="btn-format" title="Bold"><i class="fas fa-bold"></i></button>
                                <button id="fontItalicBtn" class="btn-format" title="Italic"><i class="fas fa-italic"></i></button>
                            </div>
                            <div class="control-group">
                                <label>Text Color:</label>
                                <input type="color" id="textColor" value="#000000">
                            </div>
                            <div class="control-group">
                                <label>Background Color:</label>
                                <input type="color" id="textBgColor" value="#ffffff">
                            </div>
                            <div class="control-group">
                                <label>Font Family:</label>
                                <select id="fontFamily">
                                    <option value="Arial">Arial</option>
                                    <option value="Helvetica">Helvetica</option>
                                    <option value="Times New Roman">Times New Roman</option>
                                    <option value="Courier New">Courier New</option>
                                    <option value="Verdana">Verdana</option>
                                </select>
                            </div>
                        </div>
                    </div>
                     <div class="panel-section">
                         <h4>📝 Edit History</h4>
                         <div id="historyList" class="history-list">
                             <div class="empty-history">No edits yet</div>
                         </div>
                     </div>
                </div>
            </div>
        </div>
    </div>
    <script src="js/app.js?v=1.2"></script>
</body>
</html>
